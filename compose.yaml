services:
  mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: clientloop
      MARIADB_USER: clientloop
      MARIADB_PASSWORD: clientloop
      MARIADB_ROOT_PASSWORD: clientloop-root-local
      TZ: UTC
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - clientloop_mariadb:/var/lib/mysql

volumes:
  clientloop_mariadb:
